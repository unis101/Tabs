<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
   <main class="tabs-container">

    <div class="tabs">
        <button class="tab active" data-tab="first">First Tab</button>
        <button class="tab" data-tab="second">Second Tab</button>
        <button class="tab" data-tab="third">Third Tab</button>
        <button class="tab" data-tab="fourth">Fourth Tab</button>
    </div>

    <h2>
        Clicking each tab should hide the content of the other tab and show the
        content of clicked tab. By default, enable the first tab.
    </h2>

    <div class="tab-content">

        <div class="content active" id="first">
            First Tab content to be displayed here.
        </div>

        <div class="content" id="second">
            Second Tab content to be displayed here.
        </div>

        <div class="content" id="third">
            Third Tab content to be displayed here.
        </div>

        <div class="content" id="fourth">
            Fourth Tab content to be displayed here.
        </div>

    </div>



</main> 
</body>
</html>
